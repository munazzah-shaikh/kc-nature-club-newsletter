  var html = "";

  html += (window.__NL1||"");
  html += (window.__NL2||"");
  html += (window.__NL3||"");
  html += (window.__NL4||"");
  document.open();

  Promise.all([
    fetch('kc_college_logo.b64').then(function(r){ return r.text(); }),

  ]).then(function(pair){
    var elC = document.getElementById('logo-college');
    var elN = document.getElementById('logo-nature');
    if (elC) elC.src = 'data:image/png;base64,' + pair[0].trim();
    if (elN) elN.src = 'data:image/png;base64,' + pair[1].trim();
  }).catch(function(e){ console.warn(e); });
})();
